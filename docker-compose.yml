services:
  api:
    build: .
    image: pluvia:latest
    container_name: pluvia-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - dados:/data
    restart: unless-stopped

  # Estações IoT simuladas. Suba com:  docker compose --profile demo up
  simulador:
    image: pluvia:latest
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      API_URL: http://api:8000
    command: ["python", "-m", "iot.simulador", "--cenario", "tempestade", "--intervalo", "3"]
    profiles: ["demo"]

volumes:
  dados:
